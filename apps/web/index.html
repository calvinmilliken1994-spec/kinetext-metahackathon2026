<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make knowledge interactive</title>
    <!-- Apply the saved colour theme before first paint (same key and rule as src/lib/theme.ts; dark by default). -->
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('mki.theme') === 'light' ? 'light' : 'dark'; }
      catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

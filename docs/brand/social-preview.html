<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinetext social preview (1280x640)</title>
<!--
  GitHub social preview card. Render: headless Chrome at 1280x640 (see README in this folder).
  Safe area: everything sits inside an 80 px inset (GitHub's 40 pt guide at 2x), so no crop cuts it; ?guide shows it.
  Colours and type are the app's own dark-theme tokens (apps/web/src/styles.css).
-->
<style>
  :root {
    --chrome: #18181a; --ink: #f2f4f6; --ink-2: #c5cad0; --ink-3: #a3a8af; --line-2: #45484e;
    --accent: #0064e0;
    --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--chrome); }
  body { position: relative; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .card { position: absolute; inset: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .name { margin: 0; font-size: 120px; line-height: 1; font-weight: 700; letter-spacing: -0.025em; }
  .rule { width: 64px; height: 4px; margin: 36px 0 32px; background: var(--accent); border-radius: 2px; }
  .tagline { margin: 0; font-size: 40px; line-height: 1.2; font-weight: 400; color: var(--ink-2); }
  .meta { margin: 44px 0 0; font-size: 21px; line-height: 1.4; color: var(--ink-3); }
  .meta .sep { margin: 0 12px; color: var(--line-2); }
  .guide { display: none; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 80px rgba(220, 40, 60, 0.18); outline: 2px solid rgba(220, 40, 60, 0.8); outline-offset: -80px; }
  body.show-guide .guide { display: block; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="name">Kinetext</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="tagline">Make knowledge interactive</p>
    <p class="meta">Built with Muse Spark and SAM 3.1<span class="sep">|</span>Meta Global AI Developer Hackathon 2026</p>
  </div>
  <div class="guide"></div>
  <script>if (location.search.includes('guide')) document.body.classList.add('show-guide');</script>
</body>
</html>

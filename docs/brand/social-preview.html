<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinetext social preview (1280x640)</title>
<!--
  GitHub social preview card. Render: headless Chrome at 1280x640 (see README in this folder).
  Safe area: everything that matters sits inside an 80 px inset (GitHub's 40 pt guide at 2x), so no crop cuts it.
  Colours and type are the app's own tokens (apps/web/src/styles.css, dark theme). The figure is a real capture of a
  published lesson's Label the diagram part (USGS volcano hazards sketch, U.S. public domain, graphic by Bobbie Myers).
-->
<style>
  :root {
    --chrome: #18181a; --panel: #1a1a1d; --panel-2: #26272a;
    --ink: #f2f4f6; --ink-2: #c5cad0; --ink-3: #a3a8af;
    --line: #2c2e32; --line-2: #45484e; --accent-text: #5aaefb; --accent-line: #2a5ea3; --accent-soft: #13284a;
    --font: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--chrome); }
  body { position: relative; font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  .text { position: absolute; left: 80px; top: 80px; width: 600px; height: 480px; display: flex; flex-direction: column; }
  .name { margin: 0; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
  .tagline { margin: 18px 0 0; font-size: 36px; line-height: 1.15; font-weight: 400; color: var(--ink-2); }
  .what { margin: 34px 0 0; font-size: 23px; line-height: 1.45; color: var(--ink-3); max-width: 560px; }
  .models { margin: auto 0 0; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip { font-size: 18px; line-height: 1; padding: 9px 13px; border: 1px solid var(--line-2); border-radius: 6px; color: var(--ink-2); }
  .chip.sam { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent-text); }
  .event { margin: 18px 0 0; font-size: 17px; color: var(--ink-3); }
  /* The figure: inside the safe area at the top, allowed to run off the bottom edge (decoration only there). */
  .figure { position: absolute; left: 720px; top: 80px; width: 480px; height: 560px; overflow: hidden;
    border: 1px solid var(--line-2); border-bottom: 0; border-radius: 10px 10px 0 0; background: #c9d6ea; }
  .figure img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
  /* Optional guide overlay (?guide) to check the 80 px safe area. */
  .guide { display: none; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 0 80px rgba(220, 40, 60, 0.18); outline: 2px solid rgba(220, 40, 60, 0.8); outline-offset: -80px; }
  body.show-guide .guide { display: block; }
</style>
</head>
<body>
  <div class="text">
    <h1 class="name">Kinetext</h1>
    <p class="tagline">Make knowledge interactive</p>
    <p class="what">Licensed pages become short, checked, interactive lessons for teachers, built with Meta's models.</p>
    <div class="models">
      <span class="chip">Muse Spark 1.3</span>
      <span class="chip">Muse Spark Open</span>
      <span class="chip sam">SAM 3.1</span>
    </div>
    <p class="event">Meta Global AI Developer Hackathon 2026</p>
  </div>
  <div class="figure"><img src="volcano-label-diagram.png" alt=""></div>
  <div class="guide"></div>
  <script>if (location.search.includes('guide')) document.body.classList.add('show-guide');</script>
</body>
</html>
